name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Logs every tool call, so permission denials show which command was refused.
          # Temporary, to tune --allowedTools; the repo is private.
          show_full_output: true
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            OVERRIDES — these replace parts of that command:

            STEP 1: stop only if the PR is closed or a draft. Ignore the "does not need code
            review" and "Claude has already commented on this PR" conditions: every push gets a
            full review, even when an earlier commit on this PR was already reviewed. Don't repeat
            an issue from an earlier review that the new commits have fixed.

            STEP 8 (output) — replaces step 8 entirely:
            - Write like a colleague reviewing a teammate's PR: plain words, no headings, no emoji,
              no boilerplate footer.
            - Post every issue that passed the confidence filter (score >= 80), most important
              first. Say what's wrong and what to do instead, 1-3 sentences each. Cite the
              CLAUDE.md rule verbatim when that's the reason.
            - An issue tied to changed lines gets its own inline comment: call
              mcp__github_inline_comment__create_inline_comment with path = the file, line (plus
              startLine for a range) = lines that exist in this PR's diff (use `gh pr diff` for
              new-file line numbers), side = "RIGHT", confirmed = true.
            - Always finish with exactly one top-level `gh pr comment` that starts with the verdict
              and the reviewed commit's short SHA (from `gh pr view --json headRefOid`):
              - Nothing above the bar: the entire body is
                Ready to merge — reviewed <sha>, nothing above the confidence bar.
              - Issues found: first line
                Not ready to merge — reviewed <sha>, <N> issue(s) to fix.
                then one short line per issue that has no inline comment (name the file). Issues
                already posted inline are not repeated here.
              This verdict comment is what tells a finished review apart from a broken run, so
              post it on every run.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Task,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh search:*),Bash(gh issue view:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

