name: Deploy

# Production (ADR 0008): once Test passes on a master commit, migrate Neon,
# then deploy that commit to Vercel. A failed migration stops the deploy.
# Run by hand (Actions → Deploy → Run workflow) to redeploy master.
on:
  workflow_run:
    workflows: [Test]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Pinned, and run with npx rather than added to the lockfile.
  VERCEL_CLI: vercel@64.0.2

jobs:
  production:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit Test passed on, not whatever master is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate the production database
        run: pnpm --filter @repo/db migrate:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build and deploy to Vercel
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
