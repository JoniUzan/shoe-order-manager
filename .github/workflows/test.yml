name: Test

# Every push to a PR, drafts included (unlike the billed review), and master.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://postgres@localhost:5432/shoe_test

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/domain test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.mjs domain packages/domain/coverage/coverage-summary.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-domain
          path: packages/domain/coverage/
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: shoe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Product images: the same S3 server as docker compose. A step rather
      # than a service, because the server needs its command line. The tests
      # create their bucket.
      - name: Start S3 storage
        run: |
          docker run -d --name storage -p 8333:8333 chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:8333/ && exit 0; sleep 1; done
          docker logs storage; exit 1
      - run: pnpm install --frozen-lockfile
      # Global setup migrates and seeds the database.
      - run: pnpm --filter web test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.mjs "Server Actions" apps/web/coverage/coverage-summary.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-actions
          path: apps/web/coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: shoe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/shoe_test
      DIRECT_URL: postgresql://postgres@localhost:5432/shoe_test
      AUTH_SECRET: e2e-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Product images: the same S3 server as docker compose. A step rather
      # than a service, because the server needs its command line. The tests
      # create their bucket.
      - name: Start S3 storage
        run: |
          docker run -d --name storage -p 8333:8333 chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:8333/ && exit 0; sleep 1; done
          docker logs storage; exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: pnpm --filter web build
      - run: pnpm --filter e2e test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
