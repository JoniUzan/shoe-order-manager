# Local Postgres and object storage for development: `docker compose up -d`.
# Matches the DATABASE_URL / DIRECT_URL in packages/db/.env.example and
# apps/web/.env.example. Production uses Neon; this never touches it.
#
# Major version 18 to match Neon, so local behaves like production.
# Upgrading from a 17 volume: `docker compose down -v`, then up again and
# run `pnpm dev:reset` (a data directory can't be opened by a different major
# version).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: shoe_order_manager
      # No password: the port below is bound to this machine only, so trust
      # auth lets local tools connect without a credential living in the repo.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 18's image keeps its data under /var/lib/postgresql/18/docker and
      # refuses a volume mounted at the old .../data path.
      - pgdata:/var/lib/postgresql

  # S3-compatible storage for Product images, standing in for Cloudflare R2
  # (ADR 0008): http://localhost:8333, bucket `product-images`. SeaweedFS
  # rather than MinIO, whose community images stopped being published in
  # 2025. With no credentials configured it accepts any key pair and serves
  # every object publicly, which is how the app reads images (IMAGE_BASE_URL);
  # fine because the port is bound to this machine only.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage:/data

  # Creates the dev bucket once storage is up, then exits. Re-running it is
  # harmless; `pnpm storage:reset` deletes the bucket and runs this again.
  # (The tests make their own `shoe-test` bucket.)
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      - storage
    restart: "no"
    entrypoint: >-
      sh -c 'until echo "s3.bucket.create -name product-images" | weed shell -master=storage:9333 2>&1 | grep -qE "created|exists"; do sleep 1; done'

  # Optional DB browser: `docker compose --profile studio up -d`, then
  # http://localhost:5050. The profile keeps a plain `up -d` to Postgres only.
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [studio]
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Desktop mode: no login screen and no master password, fine because the
      # port below is bound to this machine only.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Required for the container to boot, but unused in desktop mode.
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: unused-in-desktop-mode
      # Default is `::`, which fails to boot where Docker has IPv6 off; the
      # published port is IPv4 localhost anyway.
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # Pre-registers the `db` service. Imported only when the pgadmin volume
      # is new: after editing it, `docker compose rm -sf pgadmin` and
      # `docker volume rm` the pgadmin volume. pgAdmin asks for a password on
      # connect unless the server has a passfile, so it gets one; trust auth
      # never checks the password in it.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro
      - pgadmin:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin:
  storage:
