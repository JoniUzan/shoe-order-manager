# Local Postgres for development: `docker compose up -d`.
# Matches the DATABASE_URL / DIRECT_URL in packages/db/.env.example and
# apps/web/.env.example. Production uses Supabase; this never touches it.
#
# Major version 17 to match Supabase, so local behaves like production.
# Upgrading from a 16 volume: `docker compose down -v`, then up again and
# re-run `pnpm db:migrate && pnpm db:seed` (a data directory can't be opened
# by a different major version).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: shoe_order_manager
      # No password: the port below is bound to this machine only, so trust
      # auth lets local tools connect without a credential living in the repo.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional DB browser: `docker compose --profile studio up -d`, then
  # http://localhost:5050. The profile keeps a plain `up -d` to Postgres only.
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [studio]
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Desktop mode: no login screen and no master password, fine because the
      # port below is bound to this machine only.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Required for the container to boot, but unused in desktop mode.
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: unused-in-desktop-mode
      # Default is `::`, which fails to boot where Docker has IPv6 off; the
      # published port is IPv4 localhost anyway.
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # Pre-registers the `db` service. Imported only when the pgadmin volume
      # is new: after editing it, `docker compose rm -sf pgadmin` and
      # `docker volume rm` the pgadmin volume. pgAdmin asks for a password on
      # connect unless the server has a passfile, so it gets one; trust auth
      # never checks the password in it.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro
      - pgadmin:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin:
